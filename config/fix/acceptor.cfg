[DEFAULT]
ConnectionType=acceptor
BeginString=FIX.4.4
UseDataDictionary=Y
DataDictionary=fix-spec/FIX44.xml

# Store/log for resend + troubleshooting
FileStorePath=data/fix/store
FileLogPath=data/fix/log

# Session timing
HeartBtInt=30
StartTime=00:00:00
EndTime=23:59:59

# Network
SocketAcceptPort=5001
SocketReuseAddress=Y

# QuickFIX behavior (safe defaults)
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y

[SESSION]
# CompIDs must match counterparty expectations
SenderCompID=SIMPLEMATCH
TargetCompID=CLIENT
