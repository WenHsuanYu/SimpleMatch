[DEFAULT]
ConnectionType=acceptor
BeginString=FIX.4.4
UseDataDictionary=Y
#DataDictionary=fix-spec/FIX44.xml

# Store/log for resend + troubleshooting
FileStorePath=data/quickfix/store
FileLogPath=data/quickfix/log

# Session timing
HeartBtInt=30
StartTime=00:00:00
EndTime=23:59:59

# Network
SocketAcceptPort=5001
SocketReuseAddress=Y

# QuickFIX continuity defaults for same-owner restart
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N

[SESSION]
# CompIDs must match counterparty expectations
SenderCompID=SIMPLEMATCH
TargetCompID=CLIENT
