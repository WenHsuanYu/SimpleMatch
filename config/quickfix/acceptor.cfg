[DEFAULT]
ConnectionType=acceptor
BeginString=FIX.4.4
UseDataDictionary=Y
#DataDictionary=fix-spec/FIX44.xml

# Store/log for resend + troubleshooting are supplied by the Gateway's
# JDBC-backed QuickFIX/J factories.  Their tables live in quickfix_gateway.

# Session timing
HeartBtInt=30
StartTime=00:00:00
EndTime=23:59:59

# Network
SocketAcceptPort=5001
SocketReuseAddress=Y
SocketUseSSL=Y
NeedClientAuth=Y
KeyStoreType=PKCS12
TrustStoreType=PKCS12
SocketKeyStore=config/quickfix/tls/server.p12
SocketKeyStorePassword=${FIX_KEY_STORE_PASSWORD}
SocketTrustStore=config/quickfix/tls/clients.p12
SocketTrustStorePassword=${FIX_TRUST_STORE_PASSWORD}
LogMessageWhenSessionNotFound=N

# QuickFIX continuity defaults for same-owner restart
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N

[SESSION]
# CompIDs must match counterparty expectations
SenderCompID=SIMPLEMATCH
TargetCompID=CLIENT
