# One-broker development profile for the Kafka-backed Matching journals. This profile cannot pass the local RF3 durability gate.
profile.name=local
certifies.production=false
topic.partition.count=15
topic.replication.factor=1
topic.min.insync.replicas=1
topic.cleanup.policy=delete
topic.retention.ms=2592000000
capacity.retention.days=30
capacity.headroom.percent=30
broker.auto.create.topics.enable=false
broker.unclean.leader.election.enable=false
producer.acks=all
producer.enable.idempotence=true
