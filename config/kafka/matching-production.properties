# Production durability contract for the two Matching journals.
profile.name=production
certifies.production=true
topic.partition.count=15
topic.replication.factor=3
topic.min.insync.replicas=2
topic.cleanup.policy=delete
topic.retention.ms=2592000000
broker.auto.create.topics.enable=false
broker.unclean.leader.election.enable=false
producer.acks=all
producer.enable.idempotence=true
