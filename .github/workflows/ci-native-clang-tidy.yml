name: Native clang-tidy advisory

on:
  push:
    branches: [master, main]
    paths: &native_paths
      - '.github/workflows/ci-native-clang-tidy.yml'
      - '.clang-tidy'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'triplets/**'
      - 'proto/**'
      - 'matching-engine/**'
      - 'tools/native/clang_tidy_ci.py'
  pull_request:
    paths: *native_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tidy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_VERSION: 2026.07.29
  VCPKG_COMMIT_SHA: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  LLVM_VERSION: 21.1.6
  LLVM_TIDY_WHEEL_SHA256: 685e549e80461afb0f0c420ecfd0427e8bf38b927e989bdfee49dab4a9794cd1
  LLVM_RUN_TIDY_SHA256: 2b2bacf525daba5ab183f98fdbd0f21df8bb421e15d938b2245180944186fc73

jobs:
  advisory:
    name: Native / LLVM 21 advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/binaries
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
      LLVM_VENV: ${{ github.workspace }}/.ci-llvm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache vcpkg binary packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-binary-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'triplets/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-binary-${{ env.VCPKG_VERSION }}-

      - name: Cache vcpkg source downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-downloads-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-downloads-${{ env.VCPKG_VERSION }}-

      - name: Install SHA-pinned clang-tidy and runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$LLVM_VENV"
          printf 'clang-tidy==%s --hash=sha256:%s\n' \
            "$LLVM_VERSION" "$LLVM_TIDY_WHEEL_SHA256" |
            "$LLVM_VENV/bin/python" -m pip install \
              --no-deps --no-cache-dir --require-hashes -r /dev/stdin
          curl --fail --location --silent --show-error --retry 3 \
            --output "$LLVM_VENV/bin/run-clang-tidy" \
            "https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-${LLVM_VERSION}/clang-tools-extra/clang-tidy/tool/run-clang-tidy.py"
          chmod +x "$LLVM_VENV/bin/run-clang-tidy"

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$VCPKG_DOWNLOADS"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_VERSION"
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$VCPKG_COMMIT_SHA"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure handwritten Native analyzer
        run: |
          cmake --preset full-clang-tidy-report \
            -DSIMPLEMATCH_CLANG_TIDY_EXECUTABLE="$LLVM_VENV/bin/clang-tidy" \
            -DSIMPLEMATCH_RUN_CLANG_TIDY_EXECUTABLE="$LLVM_VENV/bin/run-clang-tidy" \
            -DSIMPLEMATCH_EXPECTED_CLANG_TIDY_VERSION="$LLVM_VERSION" \
            -DSIMPLEMATCH_EXPECTED_RUN_CLANG_TIDY_SHA256="$LLVM_RUN_TIDY_SHA256"

      - name: Run report-only analyzer
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset full-clang-tidy-report --parallel 2 2>&1 |
            tee "$RUNNER_TEMP/native-clang-tidy-output.log"

      - name: Record advisory warning summary
        run: python3 tools/native/clang_tidy_ci.py

      - name: Upload redacted analyzer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-clang-tidy-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/native-tidy-report.json
