name: Java CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-java-gradle/**'
      - '*'
      - 'gradle/**'
      - 'build-logic/**'
      - 'shared-java/**'
      - 'tools/**'
      - 'proto/**'
      - 'services/account-service/**'
      - 'services/marketdata-streamer/**'
      - 'services/persistence/**'
      - 'services/query-service/**'
      - 'services/quickfix-gateway/**'
      - 'services/risk-service/**'
      - 'deploy/docker/**'
      - 'deploy/k8s/verification/**'
      - 'scripts/**'
      - 'config/checkstyle/**'
      - 'config/pmd/**'
      - 'config/spotbugs/**'
      - 'config/quickfix/**'
      - 'config/*'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-java-gradle/**'
      - '*'
      - 'gradle/**'
      - 'build-logic/**'
      - 'shared-java/**'
      - 'tools/**'
      - 'proto/**'
      - 'services/account-service/**'
      - 'services/marketdata-streamer/**'
      - 'services/persistence/**'
      - 'services/query-service/**'
      - 'services/quickfix-gateway/**'
      - 'services/risk-service/**'
      - 'deploy/docker/**'
      - 'deploy/k8s/verification/**'
      - 'scripts/**'
      - 'config/checkstyle/**'
      - 'config/pmd/**'
      - 'config/spotbugs/**'
      - 'config/quickfix/**'
      - 'config/*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java / Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify RM-1 deployment contracts
        run: |
          bash scripts/test-risk-matching-e2e-manifest.sh
          bash scripts/test-risk-matching-restart-replay-manifest.sh
      - name: Set up Java and Gradle
        id: java-gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run repo-wide Java static analysis
        run: ./gradlew --no-daemon --stacktrace staticAnalysis
      - name: Run Java test suite
        run: ./gradlew --no-daemon --stacktrace test :services:quickfix-gateway:certificationTest
      - name: Run Query Redis TLS and ACL tests
        run: ./gradlew :services:query-service:redisSecurityTest --no-daemon --stacktrace
      - name: Upload Java reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-build-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/checkstyle/**
            **/build/reports/pmd/**
            **/build/reports/spotbugs/**
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/problems/**
            ${{ steps.java-gradle.outputs.build-results-json }}
