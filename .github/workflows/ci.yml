name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

env:
  VCPKG_COMMIT: b5d1a94fb7f88fd835e360fd23a45a09ceedbf48

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transaction-criteria:
    name: Transaction criteria documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify transaction criteria structure
        run: |
          bash scripts/test-check-transaction-acceptance-criteria.sh
          bash scripts/check-transaction-acceptance-criteria.sh

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      flyway: ${{ steps.filter.outputs.flyway }}
      native: ${{ steps.filter.outputs.native }}
      cdc: ${{ steps.filter.outputs.cdc }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "java=true" >> "$GITHUB_OUTPUT"
            echo "flyway=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "cdc=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          java=false
          flyway=false
          native=false
          cdc=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              .github/workflows/*|.github/actions/*|build.gradle.kts|settings.gradle.kts|gradlew|gradlew.bat|gradle/*|build-logic/*|shared-java/*|proto/*|services/account-service/*|services/marketdata-publisher/*|services/persistence/*|services/quickfix-gateway/*|services/risk-service/*|config/checkstyle/*|config/pmd/*|config/spotbugs/*|config/simplematch.example.json)
                java=true
                ;;
            esac

            case "$file" in
              .github/workflows/*|.github/actions/*|build.gradle.kts|settings.gradle.kts|gradlew|gradlew.bat|gradle/*|build-logic/*|services/account-service/*|services/marketdata-publisher/*|services/persistence/*|services/risk-service/*)
                flyway=true
                ;;
            esac

            case "$file" in
              .github/workflows/*|CMakeLists.txt|CMakePresets.json|vcpkg.json|third_party/*|matching-engine/*|src/*|include/*|tests/*)
                native=true
                ;;
            esac

            case "$file" in
              .github/workflows/*|deploy/compose/*|scripts/run-outbox-cdc-contract-check.sh|scripts/verify-outbox-connector-contracts.sh|shared-java/*|proto/*|services/account-service/*|services/marketdata-publisher/*|services/risk-service/*)
                cdc=true
                ;;
            esac
          done <<< "$changed_files"

          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "flyway=$flyway" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "cdc=$cdc" >> "$GITHUB_OUTPUT"
          printf 'Changed files detected by CI:\n%s\n' "$changed_files"

  java:
    name: Java / Gradle
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java and Gradle
        id: java-gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run repo-wide Java static analysis
        run: ./gradlew --no-daemon --stacktrace staticAnalysis
      - name: Run Java test suite
        run: ./gradlew --no-daemon --stacktrace test :services:quickfix-gateway:certificationTest
      - name: Upload Java reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-build-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/checkstyle/**
            **/build/reports/pmd/**
            **/build/reports/spotbugs/**
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/problems/**
            ${{ steps.java-gradle.outputs.build-results-json }}

  flyway:
    name: Flyway / PostgreSQL
    needs: changes
    if: needs.changes.outputs.flyway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simplematch
          POSTGRES_PASSWORD: simplematch
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simplematch -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run Flyway and PostgreSQL smoke checks
        env:
          CI_POSTGRES_HOST: 127.0.0.1
          CI_POSTGRES_PORT: '5432'
          CI_POSTGRES_USER: simplematch
          CI_POSTGRES_PASSWORD: simplematch
          CI_POSTGRES_ADMIN_DB: postgres
        run: bash scripts/run-flyway-ci-checks.sh

  cdc:
    name: Outbox CDC / Kafka Connect
    needs: changes
    if: needs.changes.outputs.cdc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify connector contracts
        run: bash scripts/verify-outbox-connector-contracts.sh
      - name: Run live CDC contract check
        run: bash scripts/run-outbox-cdc-contract-check.sh

  native:
    name: Native / CMake
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zip unzip tar
      - name: Cache vcpkg downloads and archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/downloads
            ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
      - name: Bootstrap vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_COMMIT"
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Show CMake version
        run: cmake --version
      - name: Configure native preset
        run: cmake --preset vcpkg
      - name: Build native preset
        run: cmake --build --preset vcpkg --parallel 2
      - name: Run native tests
        run: ctest --preset vcpkg
      - name: Upload native logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-build-logs
          if-no-files-found: ignore
          path: |
            build-vcpkg/CMakeCache.txt
            build-vcpkg/Testing/**
            build-vcpkg/**/*.log
