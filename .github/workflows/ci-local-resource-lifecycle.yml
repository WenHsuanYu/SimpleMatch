name: Local Resource Lifecycle CI

on:
  pull_request:
    paths:
      - '*'
      - 'gradle/**'
      - 'build-logic/**'
      - '.github/workflows/**'
      - '.github/actions/setup-java-gradle/**'
      - 'deploy/kind/**'
      - 'deploy/k8s/**'
      - 'deploy/docker/**'
      - 'scripts/end-to-end/critical-consumers/**'
      - 'scripts/end-to-end/market-data/**'
      - 'scripts/end-to-end/query-service/**'
      - 'scripts/*'
      - 'scripts/lib/**'
      - 'scripts/testdata/hard-reset/**'
      - 'scripts/testdata/focused-diagnostic/**'
      - 'scripts/testdata/recovery-runners/**'
      - 'scripts/archive/**'
      - 'services/quickfix-gateway/*'
      - 'services/quickfix-gateway/src/test/java/com/simplematch/quickfixgateway/fix/**'
      - 'docs/verification/**'
      - 'docs/operations/**'
      - 'docs/agents/**'
      - 'tools/query-evidence-verifier/src/test/resources/**'
      - 'tools/recovery-evidence-verifier/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Local resource and registry contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Validate shell lifecycle contracts
        run: |
          ruby scripts/test-hard-reset-safety.rb
          bash scripts/end-to-end/critical-consumers/tests/matching-status-contract.sh
          bash scripts/end-to-end/critical-consumers/tests/system-observation-contract.sh
          bash scripts/end-to-end/critical-consumers/tests/deployment-contract.sh
          bash scripts/end-to-end/critical-consumers/tests/verdict-contract.sh
          bash scripts/end-to-end/critical-consumers/tests/admission-contract.sh
          bash scripts/end-to-end/critical-consumers/tests/gateway-close-contract.sh
          bash scripts/end-to-end/critical-consumers/tests/verifier-helper-contract.sh
          bash scripts/end-to-end/critical-consumers/tests/verifier-image-identity-test.sh
          ruby scripts/end-to-end/critical-consumers/tests/resting-buy-verification-test.rb
          ruby scripts/end-to-end/critical-consumers/tests/gateway-recovery-verification-test.rb
          ruby scripts/end-to-end/critical-consumers/tests/matching-recovery-verification-test.rb
          ruby scripts/end-to-end/critical-consumers/tests/matching-owner-observation-test.rb
          bash scripts/end-to-end/critical-consumers/tests/matching-recovery-adapters-test.sh
          bash scripts/end-to-end/critical-consumers/tests/resting-buy-adapters-test.sh
          bash scripts/end-to-end/critical-consumers/tests/business-recovery-lifecycle-test.sh
          bash scripts/end-to-end/critical-consumers/tests/business-recovery-failure-test.sh
          python3 scripts/end-to-end/query-service/tests/security-fixtures-contract.py
          python3 scripts/end-to-end/query-service/tests/collector-http-contract.py
          python3 scripts/end-to-end/query-service/tests/policy-authority-contract.py
          python3 scripts/end-to-end/query-service/tests/lifecycle-deadline-contract.py
          python3 scripts/end-to-end/query-service/tests/lifecycle-drain-contract.py
          python3 scripts/end-to-end/query-service/tests/lifecycle-direct-contract.py
          python3 scripts/end-to-end/query-service/tests/lifecycle-cleanup-contract.py
          python3 scripts/end-to-end/query-service/tests/lifecycle-http-contract.py
          python3 scripts/end-to-end/query-service/tests/lifecycle-ownership-contract.py
          python3 scripts/end-to-end/query-service/tests/lifecycle-preflight-contract.py
          python3 scripts/end-to-end/query-service/tests/lifecycle-manifest-contract.py
          python3 scripts/end-to-end/query-service/tests/lifecycle-probe-contract.py
          bash scripts/end-to-end/query-service/tests/lifecycle-plan-contract.sh
          bash scripts/end-to-end/query-service/tests/evidence-contract.sh
          bash scripts/end-to-end/query-service/tests/lifecycle-contract.sh
          bash scripts/end-to-end/query-service/tests/isolation-contract.sh
          bash scripts/test-local-image-transport.sh
          bash scripts/test-local-image-rendering.sh
          bash scripts/test-local-certification-trading-day.sh
          bash scripts/test-local-kubernetes-dependencies.sh
          bash scripts/test-local-certification-workloads.sh
          bash scripts/test-local-certification-skip-semantics.sh
          bash scripts/test-local-certification-provenance.sh
          bash scripts/test-phase1-deployment-contracts.sh
          bash scripts/test-local-resource-report.sh
          bash scripts/test-simplematch-kind-manager.sh

  kind-integration-smoke:
    name: Live kind registry and resource lifecycle smoke
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install kind v0.32.0
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/kind-linux-amd64 \
            https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          curl --fail --silent --show-error --location \
            --output /tmp/kind-linux-amd64.sha256sum \
            https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64.sha256sum
          (cd /tmp && sha256sum --check kind-linux-amd64.sha256sum)
          sudo install -m 0755 /tmp/kind-linux-amd64 /usr/local/bin/kind
          kind version
      - name: Run live kind registry/resource smoke
        run: bash scripts/test-local-resource-kind-integration.sh
