name: Local Resource Lifecycle CI

on:
  pull_request:
    paths:
      - '*'
      - 'gradle/**'
      - 'build-logic/**'
      - '.github/workflows/**'
      - '.github/actions/setup-java-gradle/**'
      - 'deploy/kind/**'
      - 'deploy/k8s/**'
      - 'deploy/docker/**'
      - 'scripts/end-to-end/critical-consumers/**'
      - 'scripts/*'
      - 'scripts/lib/**'
      - 'scripts/testdata/hard-reset/**'
      - 'scripts/archive/**'
      - 'services/quickfix-gateway/*'
      - 'services/quickfix-gateway/src/test/java/com/simplematch/quickfixgateway/fix/**'
      - 'docs/verification/**'
      - 'docs/operations/**'
      - 'docs/agents/**'
      - 'tools/query-evidence-verifier/src/test/resources/**'
      - 'tools/recovery-evidence-verifier/**'
      - 'tools/kubernetes-tests/**'
      - 'config/manifest-check.json'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Local resource and registry contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate shell lifecycle contracts
        run: |
          bash scripts/test-local-image-transport.sh
          bash scripts/test-local-image-rendering.sh
          bash scripts/test-local-resource-report.sh
          bash scripts/test-local-resilience-dependencies.sh
