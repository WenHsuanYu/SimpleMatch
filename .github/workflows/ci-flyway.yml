name: Flyway CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-java-gradle/**'
      - '*'
      - 'gradle/**'
      - 'build-logic/**'
      - 'scripts/*'
      - 'scripts/lib/**'
      - 'scripts/end-to-end/query-service/*'
      - 'scripts/end-to-end/query-service/lib/**'
      - 'scripts/end-to-end/query-service/tests/**'
      - 'scripts/end-to-end/critical-consumers/sql/**'
      - 'scripts/end-to-end/critical-consumers/tests/**'
      - 'shared-java/**'
      - 'services/account-service/**'
      - 'services/market-data-projection/**'
      - 'services/persistence/**'
      - 'services/query-service/**'
      - 'services/quickfix-gateway/**'
      - 'services/risk-service/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-java-gradle/**'
      - '*'
      - 'gradle/**'
      - 'build-logic/**'
      - 'scripts/*'
      - 'scripts/lib/**'
      - 'scripts/end-to-end/query-service/*'
      - 'scripts/end-to-end/query-service/lib/**'
      - 'scripts/end-to-end/query-service/tests/**'
      - 'scripts/end-to-end/critical-consumers/sql/**'
      - 'scripts/end-to-end/critical-consumers/tests/**'
      - 'shared-java/**'
      - 'services/account-service/**'
      - 'services/market-data-projection/**'
      - 'services/persistence/**'
      - 'services/query-service/**'
      - 'services/quickfix-gateway/**'
      - 'services/risk-service/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flyway:
    name: Flyway / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: simplematch
          POSTGRES_PASSWORD: simplematch
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simplematch -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Validate Flyway service contracts
        run: bash scripts/test-flyway-services.sh
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run Flyway, PostgreSQL and JDBC checks
        env:
          CI_POSTGRES_HOST: 127.0.0.1
          CI_POSTGRES_PORT: '5432'
          CI_POSTGRES_USER: simplematch
          CI_POSTGRES_PASSWORD: simplematch
          CI_POSTGRES_ADMIN_DB: postgres
          CI_POSTGRES_DATABASE: simplematch_ci
        run: |
          bash scripts/run-flyway-ci-checks.sh
          bash scripts/end-to-end/critical-consumers/tests/gateway-session-sql-test.sh
