name: Flyway CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-java-gradle/**'
      - '*'
      - 'gradle/**'
      - 'build-logic/**'
      - 'tools/dependency-tests/**'
      - 'scripts/*'
      - 'scripts/lib/**'
      - 'scripts/end-to-end/query-service/*'
      - 'scripts/end-to-end/query-service/lib/**'
      - 'scripts/end-to-end/query-service/tests/**'
      - 'scripts/end-to-end/critical-consumers/sql/**'
      - 'scripts/end-to-end/critical-consumers/tests/**'
      - 'shared-java/**'
      - 'services/account-service/**'
      - 'services/market-data-projection/**'
      - 'services/persistence/**'
      - 'services/query-service/**'
      - 'services/quickfix-gateway/**'
      - 'services/risk-service/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-java-gradle/**'
      - '*'
      - 'gradle/**'
      - 'build-logic/**'
      - 'tools/dependency-tests/**'
      - 'scripts/*'
      - 'scripts/lib/**'
      - 'scripts/end-to-end/query-service/*'
      - 'scripts/end-to-end/query-service/lib/**'
      - 'scripts/end-to-end/query-service/tests/**'
      - 'scripts/end-to-end/critical-consumers/sql/**'
      - 'scripts/end-to-end/critical-consumers/tests/**'
      - 'shared-java/**'
      - 'services/account-service/**'
      - 'services/market-data-projection/**'
      - 'services/persistence/**'
      - 'services/query-service/**'
      - 'services/quickfix-gateway/**'
      - 'services/risk-service/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flyway:
    name: Flyway / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Validate Flyway service contracts
        run: ./gradlew --no-daemon --stacktrace :tools:dependency-tests:test
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run Flyway, PostgreSQL and JDBC checks
        run: ./gradlew --no-daemon --stacktrace verifyPostgres
