name: CDC CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-java-gradle/**'
      - 'tools/dependency-tests/**'
      - 'tools/recovery-evidence-verifier/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'build-logic/**'
      - 'gradle/**'
      - 'deploy/compose/**'
      - 'deploy/k8s/base/**'
      - 'config/kafka/**'
      - 'scripts/*'
      - 'scripts/lib/**'
      - 'shared-java/**'
      - 'proto/**'
      - 'services/account-service/**'
      - 'services/risk-service/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-java-gradle/**'
      - 'tools/dependency-tests/**'
      - 'tools/recovery-evidence-verifier/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'build-logic/**'
      - 'gradle/**'
      - 'deploy/compose/**'
      - 'deploy/k8s/base/**'
      - 'config/kafka/**'
      - 'scripts/*'
      - 'scripts/lib/**'
      - 'shared-java/**'
      - 'proto/**'
      - 'services/account-service/**'
      - 'services/risk-service/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cdc:
    name: Outbox CDC / Kafka Connect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify diff hygiene
        run: git diff --check HEAD^1 HEAD
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Validate Matching topic cutover
        run: bash scripts/test-matching-topic-cutover.sh
      - name: Validate Matching Kafka durability profile
        run: bash scripts/test-matching-topic-profile.sh
      - name: Run live CDC contract check
        run: ./gradlew verifyCdc --no-daemon
      - name: Retain dependency test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdc-dependency-evidence
          path: |
            tools/dependency-tests/build/reports/
            tools/dependency-tests/build/test-results/
            tools/recovery-evidence-verifier/build/test-results/
