kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: simplematch-live

nodes:
  - role: control-plane
    image: kindest/node:v1.36.1
    labels:
      simplematch.io/node-pool: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
  - role: worker
    image: kindest/node:v1.36.1
    labels:
      simplematch.io/node-pool: local-resilience
      simplematch.io/worker-slot: "0"
  - role: worker
    image: kindest/node:v1.36.1
    labels:
      simplematch.io/node-pool: local-resilience
      simplematch.io/worker-slot: "1"
  - role: worker
    image: kindest/node:v1.36.1
    labels:
      simplematch.io/node-pool: local-resilience
      simplematch.io/worker-slot: "2"
