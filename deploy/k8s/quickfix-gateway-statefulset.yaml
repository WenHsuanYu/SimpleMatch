apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quickfix-gateway
spec:
  serviceName: quickfix-gateway-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quickfix-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quickfix-gateway
    spec:
      serviceAccountName: quickfix-gateway
      terminationGracePeriodSeconds: 30
      containers:
        - name: quickfix-gateway
          image: quickfix-gateway@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: SIMPLEMATCH_KUBERNETES_ENABLED
              value: "true"
            - name: SIMPLEMATCH_KUBERNETES_CONFIG_IMPORT
              value: "kubernetes:"
            - name: SPRING_CLOUD_KUBERNETES_CONFIG_INCLUDE_PROFILE_SPECIFIC_SOURCES
              value: "false"
            - name: SPRING_CLOUD_KUBERNETES_SECRETS_INCLUDE_PROFILE_SPECIFIC_SOURCES
              value: "false"
            - name: SIMPLEMATCH_QUICKFIX_GATEWAY_OWNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: fix
              containerPort: 5001
            - name: management
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /readyz
              port: management
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: quickfix-config
              mountPath: /etc/simplematch/quickfix/acceptor-continuity.cfg
              subPath: acceptor-continuity.cfg
            - name: quickfix-data
              mountPath: /var/lib/simplematch/quickfix-gateway
      volumes:
        - name: quickfix-config
          configMap:
            name: quickfix-gateway-quickfix-config
  volumeClaimTemplates:
    - metadata:
        name: quickfix-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
