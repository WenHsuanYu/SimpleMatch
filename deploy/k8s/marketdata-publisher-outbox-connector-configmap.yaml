apiVersion: v1
kind: ConfigMap
metadata:
  name: marketdata-publisher-outbox-connector
data:
  connector.json: |
    {
      "name": "marketdata-publisher-outbox",
      "config": {
        "config.providers": "env",
        "config.providers.env.class": "org.apache.kafka.common.config.provider.EnvVarConfigProvider",
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",
        "database.hostname": "postgres",
        "database.port": "5432",
        "database.user": "${env:MARKETDATA_PUBLISHER_POSTGRES_USER}",
        "database.password": "${env:MARKETDATA_PUBLISHER_POSTGRES_PASSWORD}",
        "database.dbname": "simplematch",
        "topic.prefix": "simplematch-marketdata-publisher",
        "plugin.name": "pgoutput",
        "slot.name": "marketdata_publisher_outbox",
        "publication.name": "dbz_marketdata_publisher_outbox",
        "publication.autocreate.mode": "filtered",
        "table.include.list": "marketdata_publisher.outbox",
        "tombstones.on.delete": "false",
        "key.converter": "org.apache.kafka.connect.storage.StringConverter",
        "key.converter.schemas.enable": "false",
        "value.converter": "org.apache.kafka.connect.converters.ByteArrayConverter",
        "transforms": "outbox",
        "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
        "transforms.outbox.route.by.field": "topic",
        "transforms.outbox.route.topic.replacement": "${routedByValue}",
        "transforms.outbox.table.field.event.id": "event_id",
        "transforms.outbox.table.field.event.key": "message_key",
        "transforms.outbox.table.field.event.payload": "payload",
          "transforms.outbox.table.field.event.timestamp": "created_at",
        "transforms.outbox.table.field.event.type": "payload_type",
        "transforms.outbox.table.fields.additional.placement": "kafka_partition_id:partition,headers_json:header:headers_json"
      }
    }
