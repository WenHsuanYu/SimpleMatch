apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: simplematch-java-services-external
  labels:
    app.kubernetes.io/part-of: simplematch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: java-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 203.0.113.10/32
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 203.0.113.11/32
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - ipBlock:
            cidr: 203.0.113.12/32
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 203.0.113.13/32
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
