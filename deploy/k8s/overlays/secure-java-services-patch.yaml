apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  template:
    spec:
      containers:
        - name: account-service
          env:
            - name: SIMPLEMATCH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: account-service-secrets
                  key: postgres_dsn
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
              value: SCRAM-SHA-512
            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: simplematch-kafka-secrets
                  key: sasl_jaas_config
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION
              value: /etc/simplematch/kafka-tls/ca.p12
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simplematch-kafka-secrets
                  key: truststore_password
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
              value: HTTPS
            - name: SIMPLEMATCH_GRPC_SECURITY_TLS_ENABLED
              value: "true"
          volumeMounts:
            - name: postgres-tls
              mountPath: /etc/simplematch/postgres-tls
              readOnly: true
      volumes:
        - name: postgres-tls
          secret:
            secretName: simplematch-postgres-tls
            optional: false
        - name: grpc-tls
          secret:
            secretName: account-service-tls
            optional: false
        - name: kafka-tls
          secret:
            secretName: simplematch-kafka-tls
            optional: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quickfix-gateway
spec:
  template:
    spec:
      containers:
        - name: quickfix-gateway
          env:
            - name: SIMPLEMATCH_QUICKFIX_GATEWAY_OPERATIONS_HTTP_ENABLED
              value: "true"
            - name: SIMPLEMATCH_QUICKFIX_GATEWAY_OPERATIONS_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: simplematch-gateway-operations-secrets
                  key: operator_token
            - name: SERVER_SSL_ENABLED
              value: "true"
            - name: SERVER_SSL_CERTIFICATE
              value: /etc/simplematch/http-tls/tls.crt
            - name: SERVER_SSL_CERTIFICATE_PRIVATE_KEY
              value: /etc/simplematch/http-tls/tls.key
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
              value: SCRAM-SHA-512
            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: simplematch-kafka-secrets
                  key: sasl_jaas_config
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION
              value: /etc/simplematch/kafka-tls/ca.p12
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simplematch-kafka-secrets
                  key: truststore_password
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
              value: HTTPS
            - name: SIMPLEMATCH_GRPC_SECURITY_TLS_ENABLED
              value: "true"
            - name: SIMPLEMATCH_GRPC_SECURITY_CERTIFICATE_PATH
              value: /etc/simplematch/grpc-tls/tls.crt
            - name: SIMPLEMATCH_GRPC_SECURITY_PRIVATE_KEY_PATH
              value: /etc/simplematch/grpc-tls/tls.key
            - name: SIMPLEMATCH_GRPC_SECURITY_TRUST_CERTIFICATE_PATH
              value: /etc/simplematch/grpc-tls/ca.crt
          volumeMounts:
            - name: kafka-tls
              mountPath: /etc/simplematch/kafka-tls
              readOnly: true
            - name: http-tls
              mountPath: /etc/simplematch/http-tls
              readOnly: true
            - name: grpc-tls
              mountPath: /etc/simplematch/grpc-tls
              readOnly: true
          startupProbe:
            httpGet:
              scheme: HTTPS
          readinessProbe:
            httpGet:
              scheme: HTTPS
          livenessProbe:
            httpGet:
              scheme: HTTPS
      volumes:
        - name: kafka-tls
          secret:
            secretName: simplematch-kafka-tls
            optional: false
        - name: http-tls
          secret:
            secretName: quickfix-gateway-http-tls
            optional: false
        - name: grpc-tls
          secret:
            secretName: quickfix-gateway-tls
            optional: false
---
