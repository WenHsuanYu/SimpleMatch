apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  template:
    spec:
      containers:
        - name: account-service
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: SIMPLEMATCH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: account-service-secrets
                  key: postgres_dsn
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
              value: SCRAM-SHA-512
            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: simplematch-kafka-secrets
                  key: sasl_jaas_config
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION
              value: /etc/simplematch/kafka-tls/ca.p12
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simplematch-kafka-secrets
                  key: truststore_password
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
              value: HTTPS
            - name: SIMPLEMATCH_GRPC_SECURITY_TLS_ENABLED
              value: "true"
          volumeMounts:
            - name: postgres-tls
              mountPath: /etc/simplematch/postgres-tls
              readOnly: true
      volumes:
        - name: postgres-tls
          secret:
            secretName: simplematch-postgres-tls
            optional: false
---
