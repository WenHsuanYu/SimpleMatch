apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
spec:
  template:
    spec:
      containers:
        - name: risk-service
          env:
            - name: SIMPLEMATCH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: risk-service-secrets
                  key: postgres_dsn
            - name: SIMPLEMATCH_TRADING_DAY
              valueFrom:
                configMapKeyRef:
                  name: matching-session-config
                  key: trading_day
            - name: SIMPLEMATCH_MATCHING_IMAGE_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: matching-session-config
                  key: matching_image_digest
            - name: SIMPLEMATCH_RISK_SERVICE_ADMISSION_CDC_BACKPRESSURE_ENABLED
              value: "false"
      volumes:
        - name: market-reference
          configMap:
            name: matching-daily-artifact
            optional: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
spec:
  template:
    spec:
      containers:
        - name: query-service
          env:
            - name: SIMPLEMATCH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: query-service-secrets
                  key: postgres_dsn
            - name: SIMPLEMATCH_TRADING_DAY
              valueFrom:
                configMapKeyRef:
                  name: matching-session-config
                  key: trading_day
      volumes:
        - name: market-reference
          configMap:
            name: matching-daily-artifact
            optional: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketdata-publisher
spec:
  replicas: 0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quickfix-gateway
spec:
  volumeClaimTemplates:
    - metadata:
        name: quickfix-data
      spec:
        storageClassName: simplematch-rwo-pod
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
  template:
    spec:
      containers:
        - name: quickfix-gateway
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: SIMPLEMATCH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: quickfix-gateway-secrets
                  key: postgres_dsn
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: quickfix-fix-spec
              mountPath: /workspace/fix-spec
              readOnly: true
      volumes:
        - name: quickfix-fix-spec
          configMap:
            name: quickfix-gateway-fix-spec
            items:
              - key: FIX44.xml
                path: FIX44.xml
---
