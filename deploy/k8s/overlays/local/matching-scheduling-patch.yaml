apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matching
spec:
  template:
    spec:
      nodeSelector:
        simplematch.io/node-pool: local-resilience
        simplematch.io/cpu-manager-static: null
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: null
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: matching
      containers:
        - name: matching
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
