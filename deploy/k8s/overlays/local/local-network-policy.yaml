apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: simplematch-java-services-local-bridge
  labels:
    app.kubernetes.io/part-of: simplematch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: java-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 172.19.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 29092
