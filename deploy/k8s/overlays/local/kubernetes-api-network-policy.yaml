apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: simplematch-java-services-kubernetes-api
  labels:
    app.kubernetes.io/part-of: simplematch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: java-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.0/12
      ports:
        - protocol: TCP
          port: 443
    # kind DNATs the in-cluster Kubernetes Service to the control-plane
    # container. The control-plane address is allocated dynamically, so the
    # canonical kind Docker network is the narrowest stable local allowance.
    - to:
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        - protocol: TCP
          port: 6443
