apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: simplematch-java-services-kubernetes-api
  labels:
    app.kubernetes.io/part-of: simplematch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: java-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.0/12
      ports:
        - protocol: TCP
          port: 443
    # kind DNATs the Kubernetes Service to its control-plane container.
    # The local verifier replaces this baseline with the observed /32 address.
    # Direct local deployments must check their kind network before applying it.
    - to:
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        - protocol: TCP
          port: 6443
