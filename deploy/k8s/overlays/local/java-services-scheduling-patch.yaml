apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  template:
    spec:
      nodeSelector:
        simplematch.io/node-pool: local-resilience
      tolerations:
        - key: simplematch.io/portable-workload
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        # A stopped kind worker receives standard NoExecute taints from the
        # node controller; keep the eviction budget explicit for rescheduling.
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: account-service
              app.kubernetes.io/component: java-service
---
