apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: simplematch-local
resources:
  - ../../base
patches:
  - path: matching-scheduling-patch.yaml
images:
  - name: simplematch/account-service
    newTag: local
  - name: simplematch/risk-service
    newTag: local
  - name: simplematch/persistence
    newTag: local
  - name: simplematch/market-data-projection
    newTag: local
  - name: simplematch/marketdata-publisher
    newTag: local
  - name: simplematch/query-service
    newTag: local
  - name: simplematch/flyway-runner
    newTag: local
  - name: simplematch-matching
    newTag: local
  - name: quickfix-gateway
    newTag: local
