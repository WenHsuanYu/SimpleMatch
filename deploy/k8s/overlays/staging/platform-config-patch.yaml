apiVersion: v1
kind: ConfigMap
metadata:
  name: simplematch-platform-config
data:
  application.yaml: |
    simplematch:
      kafka:
        brokers: kafka.staging.example.invalid:9093
        topics:
          orders-validated: orders.validated
          matching-executions: matching.executions
          matching-commands: matching.commands
          matching-events: matching.events
          marketdata-events: marketdata.events
          audit-events: audit.events
        partitions:
          orders-validated: 15
          matching-executions: 15
          matching-commands: 15
          matching-events: 15
      grpc:
        targets:
          account-service: dns:///account-service:50051
          risk-service: dns:///risk-service:50052
      market:
        currency: TWD
        time-zone: Asia/Taipei
      redis:
        endpoints: redis.staging.example.invalid:6379
      observability:
        otel:
          exporter-otlp-endpoint: https://otel.staging.example.invalid:4318
