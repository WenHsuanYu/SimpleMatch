apiVersion: v1
kind: ConfigMap
metadata:
  name: risk-service-config
data:
  application.yaml: |
    simplematch:
      risk-service:
        cdc-delivery:
          enabled: true
          fixture-records-allowed: false
          consumer-group: risk-cdc-delivery
          refresh-interval: 5s
          query-timeout: 5s
        market-reference:
          artifact-location: file:/etc/simplematch/market-reference/market_reference.json
          checksum-location: file:/etc/simplematch/market-reference/market_reference.sha256
          trading-day: ${SIMPLEMATCH_TRADING_DAY}
          matching-image-digest: ${SIMPLEMATCH_MATCHING_IMAGE_DIGEST}
        admission:
          cdc-backpressure-enabled: true
          cdc-metric-name: matching.commands
          maximum-cdc-lag-events: 10000
          maximum-metric-age: 30s
