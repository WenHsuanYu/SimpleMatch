apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-connect
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/component: connector
    app.kubernetes.io/part-of: simplematch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: simplematch-kafka-connect-config
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/component: connector
    app.kubernetes.io/part-of: simplematch
data:
  bootstrap_servers: kafka:9092
  postgres_hostname: postgres
  postgres_port: "5432"
  postgres_dbname: simplematch
  postgres_sslmode: disable
  postgres_sslrootcert: /dev/null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/component: connector
    app.kubernetes.io/part-of: simplematch
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-connect
      app.kubernetes.io/component: connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-connect
        app.kubernetes.io/component: connector
        app.kubernetes.io/part-of: simplematch
    spec:
      serviceAccountName: kafka-connect
      nodeSelector:
        simplematch.io/node-pool: local-resilience
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kafka-connect
                    app.kubernetes.io/component: connector
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: simplematch.io/worker-slot
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-connect
              app.kubernetes.io/component: connector
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-connect
          image: quay.io/debezium/connect:3.6.0.Final
          imagePullPolicy: IfNotPresent
          env:
            - name: BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: simplematch-kafka-connect-config
                  key: bootstrap_servers
            - name: GROUP_ID
              value: simplematch-connect-local
            - name: CONFIG_STORAGE_TOPIC
              value: simplematch-connect-configs
            - name: OFFSET_STORAGE_TOPIC
              value: simplematch-connect-offsets
            - name: STATUS_STORAGE_TOPIC
              value: simplematch-connect-status
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONFIG_STORAGE_MIN_ISR
              value: "2"
            - name: OFFSET_STORAGE_MIN_ISR
              value: "2"
            - name: STATUS_STORAGE_MIN_ISR
              value: "2"
            - name: KEY_CONVERTER
              value: org.apache.kafka.connect.storage.StringConverter
            - name: VALUE_CONVERTER
              value: org.apache.kafka.connect.converters.ByteArrayConverter
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_SECURITY_PROTOCOL
              value: PLAINTEXT
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REST_ADVERTISED_HOST_NAME
              value: $(POD_IP)
            - name: REST_PORT
              value: "8083"
            - name: SIMPLEMATCH_POSTGRES_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: simplematch-kafka-connect-config
                  key: postgres_hostname
            - name: SIMPLEMATCH_POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: simplematch-kafka-connect-config
                  key: postgres_port
            - name: SIMPLEMATCH_POSTGRES_DBNAME
              valueFrom:
                configMapKeyRef:
                  name: simplematch-kafka-connect-config
                  key: postgres_dbname
            - name: SIMPLEMATCH_POSTGRES_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: simplematch-kafka-connect-config
                  key: postgres_sslmode
            - name: SIMPLEMATCH_POSTGRES_SSLROOTCERT
              valueFrom:
                configMapKeyRef:
                  name: simplematch-kafka-connect-config
                  key: postgres_sslrootcert
            - name: RISK_SERVICE_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: simplematch-postgres-secrets
                  key: postgres_user
            - name: RISK_SERVICE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simplematch-postgres-secrets
                  key: postgres_password
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx1g
          ports:
            - name: rest
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /
              port: rest
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /
              port: rest
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: runtime-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/component: connector
    app.kubernetes.io/part-of: simplematch
spec:
  selector:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/component: connector
  ports:
    - name: rest
      port: 8083
      targetPort: rest
