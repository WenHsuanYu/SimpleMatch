apiVersion: v1
kind: ConfigMap
metadata:
  name: account-service-config
data:
  application.yaml: |
    simplematch:
      account-service:
        grpc:
          enabled: true
        final-matching-events:
          enabled: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: persistence-config
data:
  application.yaml: |
    simplematch:
      persistence:
        matching-events:
          enabled: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-data-projection-config
data:
  application.yaml: |
    simplematch:
      market-data-projection:
        matching-events:
          enabled: true
        marketdata-events:
          enabled: true
        redis:
          enabled: true
        rebuild:
          http-enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketdata-publisher-config
data:
  application.yaml: |
    simplematch:
      marketdata-publisher:
        enabled: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: query-service-config
data:
  application.yaml: |
    simplematch:
      query-service:
        matching-events:
          enabled: true
        account-lifecycle:
          enabled: true
        redis:
          enabled: true
        market-reference:
          artifact-location: file:/etc/simplematch/market-reference/market_reference.json
          checksum-location: file:/etc/simplematch/market-reference/market_reference.sha256
          install-on-startup: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketdata-streamer-config
data:
  application.yaml: |
    simplematch:
      marketdata-streamer:
        enabled: true
        topic: marketdata.events
        consumer-group: marketdata-streamer
        grpc-port: 50053
        subscriber-queue-capacity: 256
        maximum-subscribers: 256
