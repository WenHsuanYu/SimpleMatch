metadata:
  name: marketdata-publisher-configuration-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["simplematch-platform-config", "marketdata-publisher-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["marketdata-publisher-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: query-service-configuration-reader
rules:
  - apiGroups: [""]
