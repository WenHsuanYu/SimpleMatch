apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risk-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: persistence
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: market-data-projection
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: marketdata-publisher
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: query-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: account-service-configuration-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["simplematch-platform-config", "account-service-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["account-service-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: risk-service-configuration-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["simplematch-platform-config", "risk-service-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["risk-service-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: persistence-configuration-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["simplematch-platform-config", "persistence-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["persistence-secrets"]
