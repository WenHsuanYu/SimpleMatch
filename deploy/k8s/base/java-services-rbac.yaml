apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: account-service-configuration-reader
subjects:
  - kind: ServiceAccount
    name: account-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: account-service-configuration-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: risk-service-configuration-reader
subjects:
  - kind: ServiceAccount
    name: risk-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: risk-service-configuration-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
