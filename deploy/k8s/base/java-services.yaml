apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/component: java-service
    app.kubernetes.io/part-of: simplematch
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: account-service
      app.kubernetes.io/component: java-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-service
        app.kubernetes.io/component: java-service
        app.kubernetes.io/part-of: simplematch
    spec:
      serviceAccountName: account-service
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: account-service
          image: simplematch/account-service:base
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: SIMPLEMATCH_KUBERNETES_ENABLED
              value: "true"
            - name: SIMPLEMATCH_KUBERNETES_CONFIG_IMPORT
              value: "kubernetes:"
            - name: SPRING_CLOUD_KUBERNETES_CONFIG_INCLUDE_PROFILE_SPECIFIC_SOURCES
              value: "false"
            - name: SPRING_CLOUD_KUBERNETES_SECRETS_INCLUDE_PROFILE_SPECIFIC_SOURCES
              value: "false"
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              value: PLAINTEXT
            - name: SIMPLEMATCH_GRPC_SECURITY_TLS_ENABLED
              value: "false"
            - name: SIMPLEMATCH_GRPC_SECURITY_CERTIFICATE_PATH
              value: /etc/simplematch/grpc-tls/tls.crt
            - name: SIMPLEMATCH_GRPC_SECURITY_PRIVATE_KEY_PATH
              value: /etc/simplematch/grpc-tls/tls.key
            - name: SIMPLEMATCH_GRPC_SECURITY_TRUST_CERTIFICATE_PATH
              value: /etc/simplematch/grpc-tls/ca.crt
            - name: OTEL_SERVICE_NAME
              value: account-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=simplematch,deployment.environment=$(SPRING_PROFILES_ACTIVE)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
          ports:
            - name: grpc
              containerPort: 50051
            - name: management
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: grpc-tls
              mountPath: /etc/simplematch/grpc-tls
              readOnly: true
            - name: kafka-tls
              mountPath: /etc/simplematch/kafka-tls
              readOnly: true
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: grpc-tls
          secret:
            secretName: account-service-tls
            optional: true
        - name: kafka-tls
          secret:
            secretName: simplematch-kafka-tls
            optional: true
        - name: runtime-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/part-of: simplematch
spec:
  selector:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/component: java-service
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: management
      port: 8080
      targetPort: management
---
