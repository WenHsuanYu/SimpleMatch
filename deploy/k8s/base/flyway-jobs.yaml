apiVersion: batch/v1
kind: Job
metadata:
  name: account-service-flyway
  labels:
    app.kubernetes.io/name: account-service-flyway
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: simplematch
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-service-flyway
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: account-service
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flyway
          image: simplematch/flyway-runner:base
          imagePullPolicy: IfNotPresent
          command: ["/app/run-flyway"]
          env:
            - name: SIMPLEMATCH_FLYWAY_SERVICE_ID
              value: account-service
            - name: SIMPLEMATCH_FLYWAY_SCHEMA
              value: account_service
            - name: GRADLE_USER_HOME
              value: /tmp/gradle
            - name: SIMPLEMATCH_GRADLE_PROJECT_CACHE_DIR
              value: /tmp/gradle-project
            - name: SIMPLEMATCH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: simplematch-flyway-secrets
                  key: postgres_dsn
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
            - name: build-output
              mountPath: /workspace/build
      volumes:
        - name: runtime-tmp
          emptyDir: {}
        - name: build-output
          emptyDir: {}
---
