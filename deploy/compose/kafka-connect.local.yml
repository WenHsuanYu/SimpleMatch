services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: simplematch
      POSTGRES_USER: simplematch
      POSTGRES_PASSWORD: simplematch
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "${SIMPLEMATCH_POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:8.8.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${SIMPLEMATCH_REDIS_PORT:-6379}:6379"

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Local only: the profile still disallows implicit Matching-topic creation.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    ports:
      - "9092:9092"

  kafka-connect:
    image: quay.io/debezium/connect:3.6.0.Final
    depends_on:
      - kafka
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      SIMPLEMATCH_POSTGRES_HOSTNAME: postgres
      SIMPLEMATCH_POSTGRES_PORT: "5432"
      SIMPLEMATCH_POSTGRES_DBNAME: simplematch
      SIMPLEMATCH_POSTGRES_SSLMODE: disable
      SIMPLEMATCH_POSTGRES_SSLROOTCERT: /dev/null
      GROUP_ID: simplematch-connect-cluster
      CONFIG_STORAGE_TOPIC: simplematch-connect-configs
      OFFSET_STORAGE_TOPIC: simplematch-connect-offsets
      STATUS_STORAGE_TOPIC: simplematch-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_FLUSH_INTERVAL_MS: "${SIMPLEMATCH_CONNECT_OFFSET_FLUSH_INTERVAL_MS:-60000}"
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      REST_ADVERTISED_HOST_NAME: localhost
      REST_PORT: 8083
    ports:
      - "8083:8083"
