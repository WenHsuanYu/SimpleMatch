spring:
  application:
    name: marketdata-streamer
  profiles:
    default: local
  config:
    import: ${SIMPLEMATCH_KUBERNETES_CONFIG_IMPORT:optional:kubernetes:}
  cloud:
    kubernetes:
      config:
        enabled: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        fail-fast: true
        retry:
          enabled: false
        read-type: SINGLE
        sources:
          - name: simplematch-platform-config
          - name: ${spring.application.name}-config
      secrets:
        enabled: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        enable-api: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        sources:
          - name: ${spring.application.name}-secrets
  kafka:
    bootstrap-servers: ${simplematch.kafka.brokers:localhost:9092}
    consumer:
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: manual_immediate

simplematch:
  marketdata-streamer:
    enabled: false
    topic: marketdata.events
    consumer-group: marketdata-streamer
    grpc-port: 50053
    subscriber-queue-capacity: 256
    maximum-subscribers: 256

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
