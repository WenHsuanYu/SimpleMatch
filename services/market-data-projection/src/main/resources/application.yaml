spring:
  application:
    name: market-data-projection
  profiles:
    default: local
  config:
    import: ${SIMPLEMATCH_KUBERNETES_CONFIG_IMPORT:optional:kubernetes:}
  cloud:
    kubernetes:
      config:
        enabled: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        fail-fast: true
        retry:
          enabled: false
        read-type: SINGLE
        sources:
          - name: simplematch-platform-config
          - name: ${spring.application.name}-config
      secrets:
        enabled: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        enable-api: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        sources:
          - name: ${spring.application.name}-secrets
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${simplematch.kafka.brokers:localhost:9092}
    consumer:
      group-id: market-data-projection
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: manual_immediate
    producer:
      properties:
        enable.idempotence: true
        acks: all

simplematch:
  market-data-projection:
    matching-events:
      enabled: false
      topic: matching.events
      maximum-attempts: 3
      retry-delay: 5s
      dead-letter-topic: marketdata.events.dlq
    marketdata-events:
      enabled: false
      topic: marketdata.events
      dispatch-batch-size: 100
      dispatch-interval: 1s
    redis:
      enabled: false
      refresh-batch-size: 100
      refresh-interval: 5s
    rebuild:
      http-enabled: false
      operator-token: ${SIMPLEMATCH_MARKET_DATA_PROJECTION_REBUILD_OPERATOR_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
