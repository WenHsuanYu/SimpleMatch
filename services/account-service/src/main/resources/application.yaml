spring:
  application:
    name: account-service
  profiles:
    default: local
  config:
    import: ${SIMPLEMATCH_KUBERNETES_CONFIG_IMPORT:optional:kubernetes:}
  cloud:
    kubernetes:
      config:
        enabled: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        fail-fast: true
        retry:
          enabled: false
        read-type: SINGLE
        sources:
          - name: simplematch-platform-config
          - name: ${spring.application.name}-config
      secrets:
        enabled: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        enable-api: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        sources:
          - name: ${spring.application.name}-secrets
  kafka:
    bootstrap-servers: ${simplematch.kafka.brokers:localhost:9092}
    consumer:
      group-id: account-lifecycle
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: manual_immediate

simplematch:
  account-service:
    execution-topic: matching.executions
    lifecycle-consumer:
      enabled: false
      maximum-attempts: 3
    final-matching-events:
      enabled: false
      topic: matching.events
      consumer-group: account-final-matching-events
      maximum-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
