spring:
  application:
    name: quickfix-gateway
  profiles:
    default: local
  config:
    import: ${SIMPLEMATCH_KUBERNETES_CONFIG_IMPORT:optional:kubernetes:}
  cloud:
    kubernetes:
      config:
        enabled: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        fail-fast: true
        retry:
          enabled: false
        read-type: SINGLE
        sources:
          - name: simplematch-platform-config
          - name: ${spring.application.name}-config
      secrets:
        enabled: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        enable-api: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        sources:
          - name: ${spring.application.name}-secrets
  kafka:
    bootstrap-servers: ${simplematch.kafka.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    consumer:
      group-id: ${simplematch.quickfix-gateway.owner-id:quickfix-gateway-0}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: manual_immediate

management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,quickfixGatewayReady
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics
      path-mapping:
        health: healthz
        metrics: metrics

simplematch:
  environment: local
  quickfix-gateway:
    data-plane-enabled: true
    replay-enabled: true
    operations:
      required-consecutive-open-eligible-checks: 3
      stale-status-after: 5s
      warning-oldest-event-after: 30s
      pause-oldest-event-after: 120s
      session-zone: Asia/Taipei
      session-close-time: "13:30"
      automatic-close-enabled: true
      monitor-interval-millis: 1000
      monitor-enabled: true
    final-matching-events:
      enabled: false
      topic: matching.events
      consumer-group: quickfix-final-matching-events
      maximum-attempts: 3
      delivery-batch-size: 100
      delivery-retry-delay-millis: 1000
