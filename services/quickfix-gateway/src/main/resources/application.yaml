spring:
  application:
    name: quickfix-gateway
  kafka:
    bootstrap-servers: ${simplematch.kafka.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    consumer:
      group-id: ${simplematch.quickfix-gateway.owner-id:quickfix-gateway-0}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,quickfixGatewayReady
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics
      path-mapping:
        health: healthz
        metrics: metrics

simplematch:
  quickfix-gateway:
    data-plane-enabled: true
    replay-enabled: true