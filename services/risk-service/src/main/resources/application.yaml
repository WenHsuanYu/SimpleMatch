spring:
  application:
    name: risk-service
  profiles:
    default: local
  config:
    import: ${SIMPLEMATCH_KUBERNETES_CONFIG_IMPORT:optional:kubernetes:}
  cloud:
    kubernetes:
      config:
        enabled: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        fail-fast: true
        retry:
          enabled: false
        read-type: SINGLE
        sources:
          - name: simplematch-platform-config
          - name: ${spring.application.name}-config
      secrets:
        enabled: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        enable-api: ${SIMPLEMATCH_KUBERNETES_ENABLED:false}
        sources:
          - name: ${spring.application.name}-secrets
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${simplematch.kafka.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    consumer:
      group-id: risk-routing-policy
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

simplematch:
  risk-service:
    scheduling-enabled: true
    admission:
      cdc-metric-name: orders.validated
      maximum-cdc-lag-events: 10000
      maximum-metric-age: 30s
    routing-policy-topic: market-reference.routing-policies
    routing-policy-consumer:
      enabled: false
      maximum-attempts: 3


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
