simplematch:
  environment: test

  postgres:
    # HTTP tests supply their owned PostgreSQL DataSource. The managed-pool test
    # replaces this unreachable placeholder through DynamicPropertySource.
    dsn: "jdbc:postgresql://127.0.0.1:1/unused-query-context"

  query-service:
    matching-events:
      enabled: false
    account-lifecycle:
      enabled: false
    redis:
      enabled: false

spring:
  flyway:
    enabled: false

  main:
    web-application-type: none

  cloud:
    kubernetes:
      enabled: false
      config:
        enabled: false
      secrets:
        enabled: false
