[versions]
spring-boot = "4.1.0"
spring-cloud = "2025.1.2"
protobuf-gradle-plugin = "0.10.0"
# The Spring Boot BOM manages Protobuf Java libraries, but not the protoc compiler artifact.
protobuf-protoc = "4.34.2"
# Build-tool artifact: aligned with Spring Boot 4.1's managed Flyway line.
flyway-gradle-plugin = "12.4.0"
spotbugs-gradle-plugin = "6.5.9"
spotbugs-tool = "4.10.3"
errorprone-gradle-plugin = "5.1.0"
errorprone = "2.50.0"
checkstyle = "13.9.0"
pmd = "7.24.0"
uuid-creator = "6.1.1"
quickfixj = "3.0.1"
grpc = "1.80.0"

[libraries]
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-gradle-plugin" }
h2 = { module = "com.h2database:h2" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
flyway-gradle-plugin = { module = "org.flywaydb:flyway-gradle-plugin", version.ref = "flyway-gradle-plugin" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-protoc-gen-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
lombok = { module = "org.projectlombok:lombok" }
mockito-core = { module = "org.mockito:mockito-core" }
protobuf-java = { module = "com.google.protobuf:protobuf-java" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf-gradle-plugin" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf-protoc" }
quickfixj-core = { module = "org.quickfixj:quickfixj-core", version.ref = "quickfixj" }
quickfixj-messages-fix44 = { module = "org.quickfixj:quickfixj-messages-fix44", version.ref = "quickfixj" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-gradle-plugin" }
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-gradle-plugin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-gradle-plugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-gradle-plugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
