apiVersion: v1
kind: ConfigMap
metadata:
  name: market-reference-20260825-6ca7ac178f0b
immutable: true
binaryData:
  market_reference.json: 
  market_reference.sha256: NmNhN2FjMTc4ZjBiMTJiODI1ZGQ4YTdkMDZhZWVkNDJhYzAxNjJlMWY5NDE2YzMyYjQ0MjkwYTk3NzJkZjRlMQ==
---
# Apply this volume and mount to every Risk and Matching workload.
volumes:
  - name: market-reference
    configMap:
      name: market-reference-20260825-6ca7ac178f0b
      items:
        - key: market_reference.json
          path: market_reference.json
        - key: market_reference.sha256
          path: market_reference.sha256
containers:
  - name: APPLICATION_CONTAINER_NAME
    volumeMounts:
      - name: market-reference
        mountPath: /etc/simplematch/market-reference
        readOnly: true
    env:
      - name: MARKET_REFERENCE_ARTIFACT_PATH
        value: /etc/simplematch/market-reference/market_reference.json
