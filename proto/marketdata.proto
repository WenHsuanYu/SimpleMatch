syntax = "proto3";

package simplematch.marketdata.v1;

option java_multiple_files = true;
option java_package = "com.simplematch.contracts.marketdata.v1";

import "common.proto";

message TradeUpdate {
  string symbol = 1;
  string last_px = 2;
  string last_qty = 3;
}

message TopOfBookUpdate {
  string symbol = 1;
  string bid_px = 2;
  string bid_qty = 3;
  string ask_px = 4;
  string ask_qty = 5;
}

message MarketDataEvent {
  simplematch.common.v1.EventMetadata metadata = 1;
  oneof payload {
    TradeUpdate trade = 2;
    TopOfBookUpdate top_of_book = 3;
  }
}