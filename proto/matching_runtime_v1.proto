syntax = "proto3";

package simplematch.matching.runtime.v1;

option java_multiple_files = true;
option java_package = "com.simplematch.contracts.matching.runtime.v1";

import "common_v2.proto";

// Identifies the exact final Market Reference Artifact that every command and event shares.
message ArtifactIdentity {
  string trading_day = 1;
  string content_sha256 = 2;
}

// Immutable routing and replay context carried by every final Matching command.
message CommandHeader {
  int32 schema_version = 1;
  string command_id = 2;
  string trading_session_id = 3;
  int32 partition_id = 4;
  ArtifactIdentity artifact_identity = 5;
  string routing_algorithm_version = 6;
}

// A fully admitted order that the deterministic Matching core can process without Risk lookups.
message NewOrder {
  string order_id = 1;
  string account_id = 2;
  simplematch.common.v2.VenueInstrument instrument = 3;
  simplematch.common.v2.Side side = 4;
  int64 quantity_shares = 5;
  int64 limit_price_units = 6;
  simplematch.common.v2.OrderType order_type = 7;
  simplematch.common.v2.TimeInForce time_in_force = 8;
}

// A cancellation routed to the same artifact-assigned partition as its order.
message CancelOrder {
  string order_id = 1;
  string account_id = 2;
  simplematch.common.v2.VenueInstrument instrument = 3;
  simplematch.common.v2.Side side = 4;
}

// Opens one partition only after the daily artifact and matching algorithm have been verified.
message OpenBarrier {
  int32 expected_partition_count = 1;
  int32 event_schema_version = 2;
  int32 event_identity_version = 3;
  string matching_image_digest = 4;
}

// Closes one partition and deterministically expires its remaining ROD orders.
message CloseBarrier {}

// The only ordered inputs accepted by matching.commands.
message MatchingCommand {
  CommandHeader header = 1;
  oneof command {
    NewOrder new_order = 2;
    CancelOrder cancel_order = 3;
    OpenBarrier open_barrier = 4;
    CloseBarrier close_barrier = 5;
  }
}

enum MatchingEventType {
  MATCHING_EVENT_TYPE_UNSPECIFIED = 0;
  MATCHING_EVENT_TYPE_ORDER_RESTED = 1;
  MATCHING_EVENT_TYPE_TRADE_EXECUTED = 2;
  MATCHING_EVENT_TYPE_ORDER_CANCELLED = 3;
  MATCHING_EVENT_TYPE_ORDER_EXPIRED = 4;
}

enum CancellationReason {
  CANCELLATION_REASON_UNSPECIFIED = 0;
  CANCELLATION_REASON_USER_REQUEST = 1;
  CANCELLATION_REASON_IOC_REMAINDER = 2;
  CANCELLATION_REASON_FOK_NOT_FILLED = 3;
  CANCELLATION_REASON_SESSION_EXPIRED = 4;
}

enum TradeLegState {
  TRADE_LEG_STATE_UNSPECIFIED = 0;
  TRADE_LEG_STATE_PARTIALLY_FILLED = 1;
  TRADE_LEG_STATE_FILLED = 2;
}

// One order state transition caused by a single immutable trade.
message TradeLeg {
  string order_id = 1;
  string account_id = 2;
  simplematch.common.v2.Side side = 3;
  reserved 4, 5;
  int64 cumulative_quantity_shares = 6;
  int64 leaves_quantity_shares = 7;
  // Average price after this fill, in one ten-thousandth TWD unit, for correct FIX AvgPx mapping.
  int64 average_price_units = 8;
  TradeLegState resulting_state = 9;
}

// One trade and its complete maker and taker order states.
message TradeExecuted {
  bytes trade_id = 1;
  simplematch.common.v2.VenueInstrument instrument = 2;
  TradeLeg maker = 3;
  TradeLeg taker = 4;
  int32 match_index = 5;
  simplematch.common.v2.Side aggressor_side = 6;
  int64 quantity_shares = 7;
  int64 price_units = 8;
}

// A residual order that entered the book in deterministic price-time position.
message OrderRested {
  string order_id = 1;
  string account_id = 2;
  simplematch.common.v2.VenueInstrument instrument = 3;
  simplematch.common.v2.Side side = 4;
  int64 leaves_quantity_shares = 5;
  int64 resting_price_units = 6;
}

// A terminal cancellation or expiry with the unfilled remainder.
message OrderTerminal {
  string order_id = 1;
  string account_id = 2;
  simplematch.common.v2.VenueInstrument instrument = 3;
  simplematch.common.v2.Side side = 4;
  int64 leaves_quantity_shares = 5;
  CancellationReason reason = 6;
}

// A deterministic output slot of one MatchingCommand. event_id excludes event_type by design.
message MatchingEvent {
  int32 schema_version = 1;
  int32 identity_version = 2;
  bytes event_id = 3;
  string trading_session_id = 4;
  int32 partition_id = 5;
  string source_command_id = 6;
  int64 source_input_offset = 7;
  int32 output_index = 8;
  ArtifactIdentity artifact_identity = 9;
  string routing_algorithm_version = 10;
  MatchingEventType event_type = 11;
  reserved 12;
  oneof event {
    OrderRested order_rested = 13;
    TradeExecuted trade_executed = 14;
    OrderTerminal order_cancelled = 15;
    OrderTerminal order_expired = 16;
  }
}
