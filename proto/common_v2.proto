syntax = "proto3";

package simplematch.common.v2;

option java_multiple_files = true;
option java_package = "com.simplematch.contracts.common.v2";

// Metadata carried by every v2 command and event.
message EventMetadata {
  string schema_version = 1;
  string event_id = 2;
  int64 created_at_unix_ms = 3;
  string source_service = 4;
  string correlation_id = 5;
  string causation_id = 6;
}

// Phase-one trading currency. No other currency is supported.
enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  CURRENCY_TWD = 1;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_ROD = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

// Phase-one session states. New-order admission is limited to CONTINUOUS.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_PRE_OPEN = 1;
  SESSION_STATE_CONTINUOUS = 2;
  SESSION_STATE_CLOSING = 3;
  SESSION_STATE_CLOSED = 4;
  SESSION_STATE_HALTED = 5;
}

// Identifies an XTAI or ROCO listed instrument.
message VenueInstrument {
  string symbol = 1;
  string venue_mic = 2;
}

// A Taiwan trading date in Asia/Taipei, encoded as ISO-8601 YYYY-MM-DD.
message TradingDay {
  string iso_date = 1;
}

// Signed TWD fixed-point price in one ten-thousandth TWD units.
message TwdPrice {
  int64 units = 1;
}

// Signed TWD fixed-point notional in one ten-thousandth TWD units.
message TwdNotional {
  int64 units = 1;
}
