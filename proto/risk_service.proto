syntax = "proto3";

package simplematch.risk.v1;

option java_multiple_files = true;
option java_package = "com.simplematch.contracts.risk.v1";

import "orders.proto";

service RiskService {
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

message SubmitOrderRequest {
  simplematch.orders.v1.OrderCommand command = 1;
}

message SubmitOrderResponse {
  // Synchronous/RPC name for the operation identifier.
  // In the current implementation this is the same underlying value as OrderCommand.command_id.
  // The field remains a wire string even though the runtime value is UUID-backed.
  string request_id = 1;
  string order_id = 2;
  string cl_ord_id = 3;
  bool accepted = 4;
  string reason_code = 5;
  string reason_text = 6;
}

message CancelOrderRequest {
  simplematch.orders.v1.OrderCommand command = 1;
}

message CancelOrderResponse {
  // Synchronous/RPC name for the operation identifier.
  // In the current implementation this is the same underlying value as OrderCommand.command_id.
  // The field remains a wire string even though the runtime value is UUID-backed.
  string request_id = 1;
  string order_id = 2;
  string cl_ord_id = 3;
  string orig_cl_ord_id = 4;
  bool accepted = 5;
  string reason_code = 6;
  string reason_text = 7;
}