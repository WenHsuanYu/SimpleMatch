syntax = "proto3";

package simplematch.marketdata.runtime.v1;

option java_multiple_files = true;
option java_package = "com.simplematch.contracts.marketdata.runtime.v1";

import "marketdata_runtime_v1.proto";

service MarketDataService {
  rpc SubscribeMarketDataSnapshots(SubscribeMarketDataRequest)
      returns (stream simplematch.marketdata.runtime.v1.MarketDataSnapshot);
}

message SubscribeMarketDataRequest {
  repeated string symbols = 1;
}
