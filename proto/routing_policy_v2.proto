syntax = "proto3";

package simplematch.routing.v2;

option java_multiple_files = true;
option java_package = "com.simplematch.contracts.routing.v2";

import "common_v2.proto";

// One complete immutable Routing Policy publication for one effective interval.
message RoutingPolicy {
  simplematch.common.v2.EventMetadata metadata = 1;
  string routing_policy_id = 2;
  string source_market_snapshot_id = 3;
  simplematch.common.v2.TradingDay trading_day = 4;
  int64 effective_from_unix_ms = 5;
  int64 effective_until_unix_ms = 6;
  int32 orders_validated_partition_count = 7;
  repeated InstrumentRoutingAssignment assignments = 8;
}

// The complete assignment of one market instrument to one Matching route.
message InstrumentRoutingAssignment {
  simplematch.common.v2.VenueInstrument instrument = 1;
  int32 routing_partition = 2;
}
