syntax = "proto3";

package simplematch.common.v1;

option java_multiple_files = true;
option java_package = "com.simplematch.contracts.common.v1";

message EventMetadata {
  string schema_version = 1;
  string event_id = 2;
  int64 created_at_unix_ms = 3;
  string source_service = 4;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_ROD = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_ACCEPTED = 1;
  RESERVATION_STATUS_REJECTED = 2;
  RESERVATION_STATUS_RELEASED = 3;
  RESERVATION_STATUS_APPLIED = 4;
}